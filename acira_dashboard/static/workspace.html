<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Acira · Local workspace</title>
    <link rel="icon" href="/assets/acira-mark.png" />
    <link rel="stylesheet" href="/assets/theme.css" />
    <link rel="stylesheet" href="/assets/workspace.css" />
    <script src="/assets/workspace.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <aside>
      <a class="brand" href="/" aria-label="Acira home">
        <img src="/assets/acira-logo.png" alt="Acira" /><span>LOCAL</span>
      </a>
      <span class="eyebrow nav-heading">WORKSPACE</span>
      <nav aria-label="Workspace">
        <button type="button" data-view="Agents" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8 21h8M12 17v4M7 9h2m6 0h2"/></svg>
          Agents
        </button>
        <button type="button" data-view="Approvals">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
          Approvals <span id="review-count"></span>
        </button>
        <button type="button" data-view="Policies">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m12 3 8 3v6c0 4-3 7-8 9-5-2-8-5-8-9V6z"/><path d="m8 12 3 3 5-6"/></svg>Policies
        </button>
        <button type="button" data-view="Activity">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="1"/></svg>Activity
        </button>
        <button type="button" data-view="Backtesting">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 20V10m7 10V4m7 16v-7M3 20h18"/></svg>Backtesting
        </button>
        <button type="button" data-view="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="white"/><circle cx="15" cy="17" r="3" fill="white"/></svg>Settings
        </button>
      </nav>
      <div class="sidebar-note">
        <span class="local-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Your computer</span><small
          >Policies stay in your projects.<br />Enforcement stays in your
          agents.</small
        >
      </div>
    </aside>
    <div class="workspace">
      <header>
        <div class="page-heading">
          <span class="eyebrow">LOCAL WORKSPACE</span>
          <h1 id="page-title">Agents</h1>
          <p id="page-description">Your projects and agents, in one place.</p>
        </div>
        <div class="scope">
          <label
            >Project<select id="project" aria-label="Project"></select></label
          ><label>Agent<select id="agent" aria-label="Agent"></select></label
          ><button id="refresh" type="button" aria-label="Refresh" title="Refresh workspace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1"/></svg></button>
        </div>
      </header>
      <div id="notice" role="status" aria-live="polite" hidden></div>
      <main id="content" tabindex="-1">
        <div class="empty">Connecting to your local workspace…</div>
      </main>
      <footer>
        Local policies · Human review · Action history
        <span id="connection">Connecting</span>
      </footer>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-heading">
        <h2 id="dialog-title"></h2>
        <button type="button" id="dialog-close" aria-label="Close dialog">
          Close
        </button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
  </body>
</html>
