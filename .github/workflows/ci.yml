name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: acira-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q

  chromium:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      ANONYMIZED_TELEMETRY: "false"
      BROWSER_USE_CLOUD_SYNC: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - run: python -m pip install "./dist/acira-0.1.0-py3-none-any.whl[dev,playwright,browser-use]"
      - run: python -m playwright install --with-deps chromium
      - run: python tools/configure_ci_chromium.py
      - name: Test the installed distribution outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          ACIRA_TEST_INSTALLED: "1"
        run: python -m pytest -q "${{ github.workspace }}/tests" --import-mode=importlib --basetemp="${{ runner.temp }}/acira-pytest"
      - run: node --check acira_dashboard/static/workspace.js
      - run: node --check tools/acira-capture-extension/background.js
      - run: node --check tools/acira-capture-extension/content.js
      - run: node --check tools/acira-capture-extension/connection.js

  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python tools/verify_wheel.py dist/acira-0.1.0-py3-none-any.whl
