name: SDK release
run-name: Acira approval to publish verified run ${{ inputs.verification_run }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Approve publication of the exact previously verified artifacts"
        type: choice
        options: [pypi, testpypi]
        default: pypi
      runners:
        description: "Hosted free allowance or a trusted existing Mac"
        type: choice
        options: [hosted, self-hosted]
        default: hosted
      verification_run:
        description: "Successful SDK release verification run ID"
        required: true
        type: string
      source_sha:
        description: "Exact verified main commit (40 characters)"
        required: true
        type: string
      wheel_sha256:
        description: "Approved wheel SHA-256 (64 characters)"
        required: true
        type: string
      sdist_sha256:
        description: "Approved source archive SHA-256 (64 characters)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: acira-publish-${{ inputs.publish }}
  cancel-in-progress: false

env:
  RELEASE_TARGET: ${{ inputs.publish }}
  VERIFICATION_RUN: ${{ inputs.verification_run }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
  SDIST_SHA256: ${{ inputs.sdist_sha256 }}

jobs:
  release-authorization:
    if: github.repository == 'Acira-dev/acira-sdk' && github.repository_owner_id == '286463772' && github.actor_id == '286463772' && github.triggering_actor == 'Acira-dev' && github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runners == 'self-hosted' && fromJSON(format('["self-hosted","macOS","acira-release-{0}"]', github.run_id)) || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.check.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: inputs.runners != 'self-hosted' || runner.os != 'macOS'
        with:
          python-version: "3.12"
      - name: Select verified native Python on Mac
        if: inputs.runners == 'self-hosted' && runner.os == 'macOS'
        env:
          ACIRA_RELEASE_PYTHON_VERSION: "3.12"
        run: python3 "$ACIRA_RELEASE_PYTHON_HELPER" --run-id "$GITHUB_RUN_ID" --commit "$GITHUB_SHA" --activate-python "$ACIRA_RELEASE_PYTHON_VERSION"
      - name: Validate completed verification and owner approval
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/verify_release_environment.py --environment "$RELEASE_TARGET" --verification-run "$VERIFICATION_RUN" --source-sha "$SOURCE_SHA" --wheel-sha256 "$WHEEL_SHA256" --sdist-sha256 "$SDIST_SHA256"
        shell: bash
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.check.outputs.artifact_id }}
          run-id: ${{ inputs.verification_run }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
      - name: Verify downloaded distributions match approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/verify_release_environment.py --environment "$RELEASE_TARGET" --verification-run "$VERIFICATION_RUN" --source-sha "$SOURCE_SHA" --wheel-sha256 "$WHEEL_SHA256" --sdist-sha256 "$SDIST_SHA256" --artifact-directory dist
        shell: bash

  publish:
    needs: release-authorization
    runs-on: ${{ inputs.runners == 'self-hosted' && fromJSON(format('["self-hosted","macOS","acira-release-{0}"]', github.run_id)) || 'ubuntu-latest' }}
    timeout-minutes: 10
    environment: ${{ inputs.publish }}
    permissions:
      actions: read
      id-token: write
    steps:
      # No checkout, package import, build, or test code runs with upload identity.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.release-authorization.outputs.artifact_id }}
          run-id: ${{ inputs.verification_run }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      - name: Recheck exact files immediately before upload
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re
          files = list(pathlib.Path("dist").iterdir())
          wheels = [p for p in files if re.fullmatch(r"acira-[0-9]+\.[0-9]+\.[0-9]+-py3-none-any\.whl", p.name)]
          assert len(files) == 2 and len(wheels) == 1, "Unexpected upload files"
          wheel = wheels[0]
          sdist = wheel.with_name(wheel.name.removesuffix("-py3-none-any.whl") + ".tar.gz")
          for path, key in ((wheel, "WHEEL_SHA256"), (sdist, "SDIST_SHA256")):
              expected = os.environ[key]
              assert re.fullmatch(r"[0-9a-f]{64}", expected), "Invalid approval hash"
              assert path.is_file() and not path.is_symlink(), "Invalid upload file"
              assert 0 < path.stat().st_size <= 25 * 1024 * 1024, "Invalid file size"
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, "Approval hash mismatch"
          PY
      - name: Publish using short-lived trusted identity
        shell: bash
        run: |
          if [ "$RELEASE_TARGET" = "pypi" ]; then
            uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz
          elif [ "$RELEASE_TARGET" = "testpypi" ]; then
            uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/ dist/*.whl dist/*.tar.gz
          else
            exit 1
          fi
